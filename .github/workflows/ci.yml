name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Format and host tests (AuroraFS, FAT32, gfx, image, WAV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          (cd userland && cargo fmt --all -- --check)
      - name: Validate bilingual handbook
        run: cargo xtask docs
      - name: Filesystem library tests
        run: cargo test -p aurora-help -p gina -p aurorafs -p fat32 -p lumen -p aurora-image -p aurora-wav -p nebula-web -p nebula-secure -p nebula-engine -p nebula-script -p xtask

  kernel:
    name: Kernel tests (${{ matrix.disk }}, ${{ matrix.smp }} CPU, ${{ matrix.net }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Avoid exhausting hosted-runner acquisition while retaining every configuration.
      max-parallel: 1
      matrix:
        disk: [ahci, virtio, nvme]
        smp: [4]
        net: [virtio]
        include:
          # The single-CPU path (no APs, no IPIs) stays covered too.
          - disk: ahci
            smp: 1
            net: virtio
          # And the Intel network card (e1000e: MSI-X, like real 82574s).
          - disk: nvme
            smp: 4
            net: e1000e
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf xorriso
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Kernel self-tests, two boots on the same disk
        run: cargo xtask test --disk ${{ matrix.disk }} --smp ${{ matrix.smp }} --net ${{ matrix.net }}

  boot:
    name: Boot to desktop and build the USB image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf xorriso
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build bootloader, kernel and user space
        run: cargo xtask build
      - name: Boot to desktop (headless smoke test)
        run: |
          timeout 180 cargo xtask run --no-build --headless > serial.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' serial.log | grep -v '^\s*$' | tail -40
          grep -q "Aurora desktop ready" serial.log
          grep -q "mounted AuroraFS" serial.log
      - name: Build USB disk image
        run: cargo xtask image
      - name: Build UEFI ISO
        run: cargo xtask iso --no-build
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: waveos-aurora-usb-img
          path: |
            target/waveos-aurora-usb.img
            target/waveos-aurora.iso
            target/help/
          compression-level: 9
