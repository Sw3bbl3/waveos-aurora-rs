name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Format and host tests (WaveFS, FAT32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          (cd userland && cargo fmt --all -- --check)
      - name: Filesystem library tests
        run: cargo test -p wavefs -p fat32

  kernel:
    name: Kernel tests (${{ matrix.disk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        disk: [ahci, virtio, nvme]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Kernel self-tests, two boots on the same disk
        run: cargo xtask test --disk ${{ matrix.disk }}

  boot:
    name: Boot to desktop and build the USB image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build bootloader, kernel and user space
        run: cargo xtask build
      - name: Boot to desktop (headless smoke test)
        run: |
          timeout 180 cargo xtask run --no-build --headless > serial.log 2>&1 || true
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' serial.log | grep -v '^\s*$' | tail -40
          grep -q "Aurora desktop ready" serial.log
          grep -q "mounted WaveFS" serial.log
      - name: Build USB disk image
        run: cargo xtask image
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: waveos-aurora-usb-img
          path: target/waveos-aurora-usb.img
          compression-level: 9
