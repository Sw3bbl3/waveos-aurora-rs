# ALSA on WaveOS (/etc/asound.conf, written by xtask with the Linux
# packages). Card 0 is WaveOS's sound mixer (/dev/snd/pcmC0D0p): every
# program may open it at the same time and the mixer mixes them, so no dmix
# is needed. It takes 48 kHz, one or two channels, 16-bit, 32-bit or float
# samples; "plug" converts anything else (other rates, more channels) in
# the program, and hands the rest through untouched.
pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}
ctl.!default {
    type hw
    card 0
}
