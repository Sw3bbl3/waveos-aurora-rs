[package]
name = "aurora-wifi"
version.workspace = true
edition.workspace = true
license.workspace = true

# Integer-only and no_std, so the soft-float kernel can use it. AES runs in
# its constant-time software form there (the kernel sets `aes_force_soft`).
[dependencies]
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = { version = "0.8", default-features = false }
ccm = { version = "0.5", default-features = false }
aes-kw = { version = "0.2", default-features = false }
