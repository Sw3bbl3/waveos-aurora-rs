[package]
name = "nebula-secure"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nebula-web = { path = "../web" }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "alloc"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
rand_core = { version = "0.6", default-features = false }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
