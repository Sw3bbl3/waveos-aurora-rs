[package]
name = "aurora-igfx"
version.workspace = true
edition.workspace = true
license.workspace = true

# Intel integrated graphics display programming, integer-only and no_std:
# the kernel's driver runs it over real MMIO, the host tests it over a
# simulated register file (`mock`).
[dependencies]
aurora-i2c = { path = "../i2c" }

[dev-dependencies]
aurora-edid = { path = "../edid" }
