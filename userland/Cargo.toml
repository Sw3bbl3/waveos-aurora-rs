# WaveOS Aurora user space. Built by `cargo xtask build` (never directly):
# xtask supplies the target, linker script and flags for ring-3 programs.
[workspace]
resolver = "2"
members = ["constellation", "corekit", "aurorakit", "apps/*", "bin/*"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
constellation-sdk = { path = "constellation" }
gina = { path = "../libs/gina" }
corekit = { path = "corekit" }
aurorakit = { path = "aurorakit" }
aurora-abi = { path = "../libs/abi" }
lumen = { path = "../libs/gfx" }
aurora-image = { path = "../libs/image" }
aurora-wav = { path = "../libs/wav" }
nebula-web = { path = "../libs/web" }
nebula-secure = { path = "../libs/tls" }
nebula-engine = { path = "../libs/surf" }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true
strip = true
