# WaveOS Aurora user space. Built by `cargo xtask build` (never directly):
# xtask supplies the target, linker script and flags for ring-3 programs.
[workspace]
resolver = "2"
members = ["libaurora", "ripple", "apps/*", "bin/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aurora = { path = "libaurora" }
ripple = { path = "ripple" }
aurora-abi = { path = "../libs/abi" }
aurora-gfx = { path = "../libs/gfx" }
aurora-image = { path = "../libs/image" }
aurora-wav = { path = "../libs/wav" }
aurora-web = { path = "../libs/web" }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true
strip = true
