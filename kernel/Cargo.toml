[package]
name = "aster"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aster"
test = false
bench = false

[features]
ktest = []

[dependencies]
gina = { path = "../libs/gina" }
bootinfo = { path = "../libs/bootinfo" }
lumen = { path = "../libs/gfx" }
aurora-abi = { path = "../libs/abi" }
aurora-elf = { path = "../libs/elf" }
aurorafs = { path = "../libs/aurorafs" }
fat32 = { path = "../libs/fat32" }
aurora-image = { path = "../libs/image" }
aurora-wav = { path = "../libs/wav" }
x86_64 = "0.15"
spin = "0.9"
linked_list_allocator = "0.10"
acpi = "6.1"
log = "0.4"
# Not used directly: the kernel is soft-float and never saves SIMD state, so
# gina's SHA-256 must not take its SSE/SHA-NI path when built in.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# PBKDF2 for the account password (gui::account).
hmac = { version = "0.12", default-features = false }
